<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pluks</title>
<!--
  Short, branded forwarder for the links in the Pluks lifecycle emails.

  Why this exists: the Apps Script /exec URL is 136 characters and contains
  '='. Both are hostile to the plain-text part of an email — '=' collides with
  quoted-printable's '=XX' escape and anything past 76 columns gets a soft line
  break jammed into the middle of it. That combination broke the unsubscribe
  link in a real send. This page keeps the visible link short and on our own
  domain instead.

  The action rides in the FRAGMENT (…/r/#rate/<lead_id>/<1-5>) rather than a
  query string, because a query string would reintroduce the '=' this exists to
  avoid. Fragments never reach a server, so the forwarding happens here in JS.

  Note: the List-Unsubscribe header still points straight at the Apps Script
  URL. RFC 8058 one-click is a server-to-server POST — no browser, no JS, and
  the fragment would not even be transmitted.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #0C0A08; color: #fff; padding: 24px;
    font: 400 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box; text-align: center;
  }
  .card { max-width: 420px; }
  .mark { font-size: 30px; color: #FC4C02; font-weight: 800; }
  p { color: rgba(255,255,255,.7); }
  a { color: #FFAB8A; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">&#10022;</div>
  <p id="msg">Taking you to Pluks&hellip;</p>
  <p><a id="manual" href="https://pluks.app">Continue</a></p>
</div>
<script>
(function () {
  "use strict";

  // Must match WEBAPP_URL in scripts/leads-apps-script.gs.
  var EXEC = "https://script.google.com/macros/s/AKfycbzqtzRpJGWvZkKyjLfvd8LGX1zgYWuLbuUfzAAIX__fBSCYMfJR33FH9_a_wIMhMPwBlQ/exec";
  var SITE = "https://pluks.app";

  var manual = document.getElementById("manual");
  var msg = document.getElementById("msg");

  // #rate/<lead_id>/<1-5>  |  #unsub/<lead_id>
  var parts = (location.hash || "").replace(/^#/, "").split("/").filter(Boolean);
  var action = parts[0];
  var leadId = parts[1] || "";
  var rating = parts[2] || "";

  var ok =
    (action === "unsub" && leadId) ||
    (action === "rate" && leadId && /^[1-5]$/.test(rating));

  if (!ok) {
    msg.textContent = "That link looks incomplete. Head to pluks.app, or reply to the email that brought you here.";
    manual.href = SITE;
    return;
  }

  // Rebuild the path-style Apps Script URL. encodeURIComponent keeps a
  // malformed id from escaping the path segment.
  var target = EXEC + "/" + action + "/" + encodeURIComponent(leadId) +
               (action === "rate" ? "/" + rating : "");

  manual.href = target;
  manual.textContent = "Continue";
  location.replace(target);
})();
</script>
</body>
</html>
